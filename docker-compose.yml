services:
  trader:
    build: .
    command: sh entrypoint.sh
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./strategy.json:/app/strategy.json
      - ./strategy.py:/app/strategy.py
    depends_on:
      - dashboard

  dashboard:
    build: .
    command: python dashboard.py
    restart: always
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./strategy.json:/app/strategy.json
