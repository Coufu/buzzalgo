services:
  trader:
    build: .
    command: sh entrypoint.sh
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./strategy.json:/app/strategy.json
      - ./strategy.py:/app/strategy.py
    depends_on:
      dashboard:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.stat('/app/trader.py')"]
      interval: 60s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    command: python dashboard.py
    restart: always
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./strategy.json:/app/strategy.json
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
